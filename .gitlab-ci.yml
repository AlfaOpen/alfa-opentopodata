stages:
  - test
  - deploy
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  DOCKER_DRIVER: overlay2
  GIT_DEPTH: "0"
  IMAGE_NAME: alfa-opentopodata
  STAGE_BRANCH: stage
  MAIN_BRANCH: main-alfameg
  RELEASE_END: "-RELEASE"
  DEMO_END: "-DEMO"
  K8S_RESOURCES_BRANCH: main
  K8S_RESOURCE_PATH: dem-api

.get_tag: &get_tag |
  VERSION_NUMBER="$(grep -E -o '^[0-9]+\.[0-9]+\.[0-9]+' VERSION)"
  test -n "$VERSION_NUMBER"
  IMAGE_TAG="v${VERSION_NUMBER}"
  RELEASE_TAG="${IMAGE_TAG}${RELEASE}"
  export VERSION_NUMBER IMAGE_TAG RELEASE_TAG
  echo "Building release image ${RELEASE_TAG}"

.git_op: &do_git
  - apk add --no-cache git openssh curl bash
  - git config --global user.name "CI Bot"
  - git config --global user.email "support@alfameg.com"
  - git config --global init.defaultBranch $MAIN_BRANCH

container-tests:
  stage: test
  tags:
    - stage
  image: docker:29.9.2-cli
  services:
    - name: docker:29.9.2-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  before_script:
    - apk add --no-cache make
  script:
    - docker info
    - make test

build-and-push-image:
  stage: deploy
  tags:
    - stage
  image: docker:29.9.2-cli
  services:
    - name: docker:29.9.2-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  before_script:
    - *get_tag
  script:
    - echo $HARBOR_PASSWORD | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin
    - docker build -f docker/Dockerfile -t $IMAGE_NAME:$RELEASE_TAG .
    - docker tag $IMAGE_NAME:$RELEASE_TAG $HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$RELEASE_TAG
    - docker push $HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$RELEASE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == $STAGE_BRANCH'
      variables:
        RELEASE: "$DEMO_END"
    - if: '$CI_COMMIT_BRANCH == $MAIN_BRANCH'
      variables:
        RELEASE: "$RELEASE_END"

release-stage:
  stage: release
  image: alpine:3.17.3
  tags:
    - stage
  before_script:
    - *do_git
    - wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 && chmod +x /usr/bin/yq
    - *get_tag
  script:
    - export REPO_URL="https://$CI_USER:$CI_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - git remote set-url origin "$REPO_URL"
    - git fetch --tags --prune
    - git tag -a "$RELEASE_TAG" -m "[ci skip] release $RELEASE_TAG"
    - git push origin "$RELEASE_TAG"
    - export NEW_IMAGE="$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$RELEASE_TAG"
    - export ENVIRONMENT="$ENVIRONMENT"
    - mkdir /k8s
    - cd /k8s
    - git clone https://$CI_USER:$CI_TOKEN@gitlab.alfameg.it/developteam/inest-team/infrastructure/k8s-resources
    - cd /k8s/k8s-resources/
    - git config pull.rebase true
    - yq eval ".spec.template.spec.containers[0].image = \"$NEW_IMAGE\"" -i /k8s/k8s-resources/$K8S_RESOURCE_PATH/$ENVIRONMENT/deployment.yml
    - git add .
    - git commit -m "[ci skip] update container image to $RELEASE_TAG"
    - git push origin $K8S_RESOURCES_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH == $STAGE_BRANCH
      variables:
        ENVIRONMENT: "stage"
        RELEASE: "$DEMO_END"
      when: manual
    - if: $BRANCH_NAME != $STAGE_BRANCH
      when: never
  needs:
    - job: build-and-push-image
      artifacts: false
  manual_confirmation: "ARE YOU SURE YOU WANT TO DEPLOY IN STAGE?"

main-release:
  stage: release
  image: alpine:3.17.3
  tags:
    - production
  before_script:
    - *do_git
    - wget -qO /usr/bin/yq https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 && chmod +x /usr/bin/yq
    - *get_tag
  script:
    - export REPO_URL="https://$CI_USER:$CI_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git"
    - git remote set-url origin "$REPO_URL"
    - git fetch --tags --prune
    - git tag -a "$RELEASE_TAG" -m "[ci skip] release $RELEASE_TAG"
    - git push origin "$RELEASE_TAG"
    - export NEW_IMAGE="$HARBOR_HOST/$HARBOR_PROJECT/$IMAGE_NAME:$RELEASE_TAG"
    - export ENVIRONMENT="$ENVIRONMENT"
    - mkdir /k8s
    - cd /k8s
    - git clone https://$CI_USER:$CI_TOKEN@gitlab.alfameg.it/developteam/inest-team/infrastructure/k8s-resources
    - cd /k8s/k8s-resources/
    - git config pull.rebase true
    - yq eval ".spec.template.spec.containers[0].image = \"$NEW_IMAGE\"" -i /k8s/k8s-resources/$K8S_RESOURCE_PATH/$ENVIRONMENT/deployment.yml
    - git add .
    - git commit -m "[ci skip] update container image to $RELEASE_TAG"
    - git push origin $K8S_RESOURCES_BRANCH
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
      variables:
        ENVIRONMENT: "production"
        RELEASE: "$RELEASE_END"
      when: manual
    - if: $BRANCH_NAME != $MAIN_BRANCH
      when: never
  needs:
    - job: build-and-push-image
      artifacts: false
  manual_confirmation: "ARE YOU SURE YOU WANT TO DEPLOY IN PRODUCTION?"
